services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      NUXT_TURN_ID: ${NUXT_TURN_ID:?Set NUXT_TURN_ID in your external env file}
      NUXT_TURN_TOKEN: ${NUXT_TURN_TOKEN:?Set NUXT_TURN_TOKEN in your external env file}
      NUXT_PUBLIC_TELEMETRYDECK_APP_ID: ${NUXT_PUBLIC_TELEMETRYDECK_APP_ID:-}
      NUXT_PUBLIC_DOCS_URL: ${NUXT_PUBLIC_DOCS_URL:-https://litsi.nirjan.dev/}
    expose:
      - '3000'
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      LITSI_DOMAIN: ${LITSI_DOMAIN:?Set LITSI_DOMAIN to your public hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
